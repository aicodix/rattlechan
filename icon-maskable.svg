		<rect id="board" x="128" y="118" width="256" height="256" rx="14"/>
		<!-- the parts in front are drawn again over the board and cut by
		these where they go behind it, so they join without a seam -->
		<mask id="in-front" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
			<g fill="none" stroke="#fff" stroke-width="72">
				<use href="#neck"/>
				<use href="#band"/>
			</g>
		</mask>
		<mask id="out-of-the-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
			<rect width="512" height="512" fill="#fff"/>
			<path d="M149 136.7 L123 137.7" stroke="#000" stroke-width="70"/>
		</mask>
		<g id="head" transform="translate(347.5 376.7) rotate(169.7) scale(1 -1)">
			<path d="M-42 2 C-44 -28 -12 -40 18 -36 C46 -32 62 -14 60 4 C58 24 36 34 8 34 C-22 34 -40 26 -42 2 Z"/>
		</g>
		<g id="rattle" transform="translate(196 88) rotate(-90)">
			<rect x="-4" y="-15" width="28" height="30" rx="14"/>
			<rect x="20" y="-13" width="24" height="26" rx="12"/>
			<rect x="40" y="-11" width="20" height="22" rx="10"/>
			<rect x="56" y="-9" width="16" height="18" rx="8"/>
		</g>
		<!-- the rattling, as on Rattlegram's logo: three lines on each side,
		from one point beside the rattle's first segment, fanning out, the
		outer ones shorter, as the tip swinging out reaches less high, with
		an arch for each segment that grows from nothing at that point -->
		<path id="rattling" transform="translate(196 88) rotate(-90)" d="M6 -21 Q14.0 -24.2 22.0 -22.5 Q32.0 -29.2 42.0 -22.3 Q50.0 -29.0 58.0 -21.7 Q65.0 -28.4 72.0 -21.0 M6 -21 Q12.9 -25.7 19.8 -25.6 Q28.4 -34.4 37.0 -29.4 Q43.8 -37.7 50.7 -32.0 Q56.7 -40.0 62.8 -34.0 M6 -21 Q11.6 -27.3 17.2 -28.8 Q24.2 -39.5 31.2 -36.5 Q36.8 -46.3 42.4 -42.2 Q47.3 -51.6 52.2 -47.0 M6 21 Q14.0 24.2 22.0 22.5 Q32.0 29.2 42.0 22.3 Q50.0 29.0 58.0 21.7 Q65.0 28.4 72.0 21.0 M6 21 Q12.9 25.7 19.8 25.6 Q28.4 34.4 37.0 29.4 Q43.8 37.7 50.7 32.0 Q56.7 40.0 62.8 34.0 M6 21 Q11.6 27.3 17.2 28.8 Q24.2 39.5 31.2 36.5 Q36.8 46.3 42.4 42.2 Q47.3 51.6 52.2 47.0"/>
	</defs>
	<rect width="512" height="512" fill="#1c1b1a"/>
	<g transform="translate(256 256) scale(0.819) translate(-250 -214)" stroke-linejoin="round">
		<!-- the white outline behind everything -->
		<g fill="#fff" stroke="#fff" stroke-linecap="round">
			<use href="#board" stroke-width="36"/>
			<use href="#body-halo" stroke="none"/>
			<use href="#head" stroke-width="36"/>
			<use href="#rattle" stroke-width="30"/>
			<use href="#rattling" fill="none" stroke-width="14"/>
		</g>
		<!-- the whole snake, behind the board -->
		<use href="#body-edge" fill="#1c1b1a"/>
		<use href="#body-fill" fill="#24b021"/>
		<!-- the board: cork in a wooden frame -->
		<use href="#board" fill="#8a5a2b" stroke="#1c1b1a" stroke-width="10"/>
		<rect x="146" y="136" width="220" height="220" rx="6" fill="#d9a86a" stroke="#1c1b1a" stroke-width="6"/>
		<!-- the notes, pinned, two of them low enough for the snake to see -->
		<g stroke="#1c1b1a" stroke-width="5">
			<rect x="158" y="298" width="58" height="52" fill="#f4d03f" transform="rotate(-5 187 324)"/>
			<rect x="230" y="300" width="58" height="52" fill="#7fb2e6" transform="rotate(4 259 326)"/>
			<rect x="252" y="142" width="58" height="52" fill="#f28fb1" transform="rotate(3 281 168)"/>
		</g>
		<g stroke="#1c1b1a" stroke-width="5" stroke-linecap="round" opacity="0.7">
			<path d="M168 324 L206 321 M169 338 L194 336" transform="rotate(-5 187 324)"/>
			<path d="M240 326 L278 328 M240 340 L264 341" transform="rotate(4 259 326)"/>
			<path d="M262 170 L300 172 M262 184 L286 185" transform="rotate(3 281 168)"/>
		</g>
		<g fill="#c4302b" stroke="#1c1b1a" stroke-width="3">
			<circle cx="187" cy="305" r="7"/>
			<circle cx="259" cy="307" r="7"/>
			<circle cx="281" cy="149" r="7"/>
		</g>
		<!-- the snake again where it is in front of the board -->
		<g fill="none" stroke-linecap="round">
			<g mask="url(#in-front)">
				<use href="#neck-edge" fill="#1c1b1a"/>
				<use href="#neck-fill" fill="#24b021"/>
				<use href="#band-edge" fill="#1c1b1a"/>
				<use href="#band-fill" fill="#24b021"/>
			</g>
			<g mask="url(#out-of-the-edge)" stroke-linecap="butt">
				<use href="#tail-edge" fill="#1c1b1a"/>
				<use href="#tail-fill" fill="#24b021"/>
			</g>
		</g>
		<use href="#rattle" fill="#e3c77a" stroke="#1c1b1a" stroke-width="6"/>
		<use href="#rattling" fill="none" stroke="#1c1b1a" stroke-width="3.5" stroke-linecap="round"/>
		<!-- the head, looking at the blue note -->
		<use href="#head" fill="#24b021" stroke="#1c1b1a" stroke-width="10"/>
		<g transform="translate(347.5 376.7) rotate(169.7) scale(1 -1)" fill="none" stroke-linecap="round">
			<path d="M14 22 C30 26 44 22 56 14" stroke="#1c1b1a" stroke-width="6"/>
			<path d="M60 6 L74 8 L82 2 M74 8 L82 16" stroke="#c4302b" stroke-width="5"/>
		</g>
		<circle cx="324.1" cy="370.8" r="17" fill="#c9d82e" stroke="#1c1b1a" stroke-width="6"/>
		<ellipse cx="318.3" cy="366.8" rx="5" ry="11" fill="#1c1b1a"/>
		<circle cx="329.1" cy="363.8" r="4" fill="#fff"/>
	</g>
</svg>
