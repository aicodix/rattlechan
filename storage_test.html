<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage Test</title>
<style>
	body { font-family: monospace; margin: 16px; background: #fff; color: #000; }
	@media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } a { color: #8bf; } }
	button, input { font: inherit; margin: 4px 0; }
</style>
<!-- the browser half of storage_test.mjs and archive_test.mjs: the store on
     the Origin Private File System, export and import as .tar.gz. Works in
     directories of its own (rattlechan-test-*), never on the station's data.
     Serve the directory with python3 -m http.server and open it. -->
<h1>Storage Test</h1>
<pre id="out">running …</pre>
<p><a id="download" hidden>download the test archive</a></p>
<p><label>import a .tar.gz into a test store: <input id="file" type="file" accept=".gz,.tgz,application/gzip"></label></p>
<pre id="imported"></pre>
<script type="module">
import { opfsBackend, openStore } from './storage.js';
import { exportArchive, importArchive } from './archive.js';

const out = [];
let failed = 0;
const check = (name, got, want) => {
	if (got === want) {
		out.push(`ok   ${name}`);
	} else {
		++failed;
		out.push(`FAIL ${name}: got ${got}, want ${want}`);
	}
};
const hex = (a) => a && Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');

async function fresh(root) {
	const top = await navigator.storage.getDirectory();
	try {
		await top.removeEntry(root, { recursive: true });
	} catch {}
	return opfsBackend(root);
}

try {
	const t0 = performance.now();
	const backend = await fresh('rattlechan-test-a');
	let clock = 1763380000000;
	const S = await openStore(backend, { now: () => clock });
	await S.setSettings({ budgets: { precious: 3000, logged: 1000 } });
	const names = [];
	for (let i = 0; i < 20; ++i) {
		clock += 1000;
		names.push(await S.addFrame(new Uint8Array(500).fill(i), { tier: 'precious', callSign: i % 2 ? 'DL1ABC' : 'W1AW/P', mode: 65 }));
		await S.addFrame(new Uint8Array(400).fill(0x50 + i)); // spam in the logged tier
	}
	check('budget keeps six precious frames', (await S.frames('precious')).length, 6);
	check('the newest stay', (await S.frames('precious')).map((f) => f.name).join(), names.slice(14).join());
	check('spam stays in the logged tier', (await S.frames('logged')).length, 2);
	check('bytes as written', hex(await S.readFrame(names[19])), hex(new Uint8Array(500).fill(19)));
	const touched = await S.touch(names[14]);
	clock += 1000;
	await S.addFrame(new Uint8Array(500).fill(99), { tier: 'precious' });
	check('touched frame survives', (await S.frames()).some((f) => f.name === touched), true);
	const rev = new Uint8Array(99);
	rev[0] = 0x20;
	rev[1] = 97;
	rev.fill(5, 2, 34);
	rev[98] = 0x29;
	await S.addRevocation(rev, clock);
	await S.putData('trust', { trusted: ['05'.repeat(32)] });
	await S.putSecret('keys', { test: 'not a real key' });

	// a second store on the same files sees all of it
	const again = await openStore(await opfsBackend('rattlechan-test-a'));
	check('frames persist', (await again.frames()).length, 8);
	check('tiers persist', (await again.frames('logged')).length, 2);
	check('revocation persists', (await again.revocations())[0].reason, 'compromised');

	// export, import into another directory
	const data = await exportArchive(backend);
	const secrets = await exportArchive(backend, { secrets: true });
	const other = await fresh('rattlechan-test-b');
	const r = await importArchive(other, data);
	await importArchive(other, secrets);
	const T = await openStore(other);
	check('import adds frames, revocation and data', r.added.length, 11);
	check('frames after import', (await T.frames()).map((f) => f.name).join(), (await S.frames()).map((f) => f.name).join());
	check('secret after import', (await T.getSecret('keys')).test, 'not a real key');
	check('second import keeps all', (await importArchive(other, data)).kept.length, 11);

	const link = document.getElementById('download');
	link.href = URL.createObjectURL(new Blob([data], { type: 'application/gzip' }));
	link.download = 'rattlechan-test.tar.gz';
	link.hidden = false;

	const est = await navigator.storage.estimate();
	const persisted = navigator.storage.persisted ? await navigator.storage.persisted() : 'unknown';
	out.push(`\nquota ${(est.quota / 2 ** 20).toFixed(0)} MiB, used ${(est.usage / 2 ** 20).toFixed(1)} MiB, persistent: ${persisted}`);
	out.push(`took ${Math.round(performance.now() - t0)} ms`);
} catch (e) {
	++failed;
	out.push(`FAIL ${e.name}: ${e.message}`);
}
out.push(failed ? `${failed} failed` : 'all passed');
document.getElementById('out').textContent = out.join('\n');
document.title = failed ? `Storage Test: ${failed} failed` : 'Storage Test: all passed';

document.getElementById('file').addEventListener('change', async (ev) => {
	const shown = document.getElementById('imported');
	try {
		const backend = await fresh('rattlechan-test-import');
		const r = await importArchive(backend, new Uint8Array(await ev.target.files[0].arrayBuffer()));
		const T = await openStore(backend);
		shown.textContent = `added ${r.added.length}, skipped ${r.skipped.length}\n` +
			(await T.frames()).map((f) => `${new Date(f.arrival).toISOString()} ${f.tier.padEnd(8)} ${f.callSign ?? '-'} mode ${f.mode ?? '-'} ${f.size} bytes`).join('\n');
	} catch (e) {
		shown.textContent = `import failed: ${e.message}`;
	}
});
</script>
</html>
